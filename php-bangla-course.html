        content:`
<div class="concept-block">
<h3>🔐 Web Security</h3>
<p>প্রতিটি web app-এ কিছু common security threat আছে। এগুলো জানা এবং সুরক্ষা করা অত্যন্ত জরুরি।</p>
</div>

<div class="code-card">
<div class="code-header"><div class="code-dots"><span class="cd cd-r"></span><span class="cd cd-y"></span><span class="cd cd-g"></span></div><span class="code-tag">security.php</span></div>
<pre class="php-code"><span class="kw">&lt;?php</span>
<span class="cmt">// ======= ১. XSS (Cross-Site Scripting) থেকে বাঁচো =======</span>
<span class="cmt">// ❌ বিপজ্জনক — সরাসরি ইনপুট দেখাচ্ছে</span>
<span class="kw">echo</span> <span class="var">$_GET</span><span class="op">[</span><span class="str">'name'</span><span class="op">];</span>

<span class="cmt">// ✅ নিরাপদ — htmlspecialchars দিয়ে escape করো</span>
<span class="kw">echo</span> <span class="fn">htmlspecialchars</span><span class="op">(</span><span class="var">$_GET</span><span class="op">[</span><span class="str">'name'</span><span class="op">],</span> <span class="cls">ENT_QUOTES</span><span class="op">,</span> <span class="str">'UTF-8'</span><span class="op">);</span>

<span class="cmt">// ======= ২. Password Hash =======</span>
<span class="cmt">// ❌ কখনো plain text password রেখো না</span>
<span class="var">$bad</span> <span class="op">=</span> <span class="str">"password123"</span><span class="op">;</span>  <span class="cmt">// DB-তে এভাবে রাখা যাবে না</span>

<span class="cmt">// ✅ password_hash() — bcrypt দিয়ে hash করে</span>
<span class="var">$password</span> <span class="op">=</span> <span class="str">"আমারPassword@123"</span><span class="op">;</span>
<span class="var">$hashed</span> <span class="op">=</span> <span class="fn">password_hash</span><span class="op">(</span><span class="var">$password</span><span class="op">,</span> <span class="cls">PASSWORD_BCRYPT</span><span class="op">);</span>
<span class="cmt">// DB-তে $hashed সংরক্ষণ করো</span>

<span class="cmt">// Login করার সময় verify করো</span>
<span class="kw">if</span> <span class="op">(</span><span class="fn">password_verify</span><span class="op">(</span><span class="var">$password</span><span class="op">,</span> <span class="var">$hashed</span><span class="op">)) {</span>
    <span class="kw">echo</span> <span class="str">"✅ পাসওয়ার্ড সঠিক!"</span><span class="op">;</span>
<span class="op">}</span>

<span class="cmt">// ======= ৩. CSRF Token =======</span>
<span class="fn">session_start</span><span class="op">();</span>
<span class="cmt">// Token তৈরি করো</span>
<span class="kw">if</span> <span class="op">(!</span><span class="fn">isset</span><span class="op">(</span><span class="var">$_SESSION</span><span class="op">[</span><span class="str">'csrf_token'</span><span class="op">])) {</span>
    <span class="var">$_SESSION</span><span class="op">[</span><span class="str">'csrf_token'</span><span class="op">] =</span> <span class="fn">bin2hex</span><span class="op">(</span><span class="fn">random_bytes</span><span class="op">(</span><span class="num">32</span><span class="op">));</span>
<span class="op">}</span>
<span class="cmt">// Form-এ hidden field হিসেবে দাও</span>
<span class="cmt">// &lt;input type="hidden" name="csrf" value="&lt;?= $_SESSION['csrf_token'] ?&gt;"&gt;</span>

<span class="cmt">// Submit হলে verify করো</span>
<span class="kw">if</span> <span class="op">(</span><span class="var">$_POST</span><span class="op">[</span><span class="str">'csrf'</span><span class="op">]</span> <span class="op">!==</span> <span class="var">$_SESSION</span><span class="op">[</span><span class="str">'csrf_token'</span><span class="op">]) {</span>
    <span class="kw">die</span><span class="op">(</span><span class="str">"❌ CSRF আক্রমণ শনাক্ত!"</span><span class="op">);</span>
<span class="op">}</span>

<span class="cmt">// ======= ৪. Input Validation =======</span>
<span class="var">$email</span> <span class="op">=</span> <span class="fn">filter_var</span><span class="op">(</span><span class="var">$_POST</span><span class="op">[</span><span class="str">'email'</span><span class="op">],</span> <span class="cls">FILTER_VALIDATE_EMAIL</span><span class="op">);</span>
<span class="var">$age</span>   <span class="op">=</span> <span class="fn">filter_var</span><span class="op">(</span><span class="var">$_POST</span><span class="op">[</span><span class="str">'age'</span><span class="op">],</span>   <span class="cls">FILTER_VALIDATE_INT</span><span class="op">);</span>
<span class="var">$url</span>   <span class="op">=</span> <span class="fn">filter_var</span><span class="op">(</span><span class="var">$_POST</span><span class="op">[</span><span class="str">'url'</span><span class="op">],</span>   <span class="cls">FILTER_VALIDATE_URL</span><span class="op">);</span>
<span class="kw">?&gt;</span></pre>
</div>

// ============================================================
// FLATTEN LESSONS
// ============================================================
const allLessons = [];
PHASES.forEach((ph, pi) => {
  ph.lessons.forEach((l, li) => {
    allLessons.push({ ...l, phaseIdx: pi, lessonIdx: li, globalIdx: allLessons.length });
  });
});

document.getElementById('total-lessons-stat').textContent = allLessons.length;

// Done state
const done = new Set(JSON.parse(localStorage.getItem('php_done') || '[]'));

// ============================================================
// BUILD SIDEBAR NAV
// ============================================================
function buildNav() {
  const container = document.getElementById('nav-container');
  container.innerHTML = '';
  PHASES.forEach((ph, pi) => {
    const phDiv = document.createElement('div');
    phDiv.className = 'nav-phase';
    phDiv.innerHTML = `
      <button class="phase-btn" id="phasebtn-${pi}" onclick="togglePhase(${pi})">
        <span class="phase-dot" style="color:${ph.color};background:${ph.color}20;border:1.5px solid ${ph.color}"></span>
        <span class="phase-label">${ph.name}</span>
        <span style="margin-left:auto;color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace">${ph.lessons.length}</span>
      </button>
      <div class="lesson-list" id="lessonlist-${pi}">
        ${ph.lessons.map((l, li) => {
          const gIdx = PHASES.slice(0,pi).reduce((a,p)=>a+p.lessons.length,0) + li;
          return `<button class="lesson-item ${done.has(gIdx)?'done':''}" id="lessonitem-${gIdx}" onclick="loadLesson(${pi},${li})">${l.title}</button>`;
        }).join('')}
      </div>`;
    container.appendChild(phDiv);
  });
}

function togglePhase(pi) {
  const list = document.getElementById('lessonlist-' + pi);
  list.classList.toggle('open');
}

function openPhase(pi) {
  document.getElementById('lessonlist-' + pi)?.classList.add('open');
}

// ============================================================
// LOAD LESSON
// ============================================================
let currentGlobal = -1;

function loadLesson(pi, li) {
  const ph = PHASES[pi];
  const lesson = ph.lessons[li];
  const gIdx = PHASES.slice(0,pi).reduce((a,p)=>a+p.lessons.length,0) + li;
  currentGlobal = gIdx;

  // Hide welcome, show lesson area
  document.getElementById('welcome').style.display = 'none';
  const area = document.getElementById('lesson-area');
  area.style.display = 'block';

  // Active states
  document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.phase-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('lessonitem-' + gIdx)?.classList.add('active');
  document.getElementById('phasebtn-' + pi)?.classList.add('active');
  openPhase(pi);

  // Prev/Next
  const prevIdx = gIdx - 1;
  const nextIdx = gIdx + 1;
  const hasPrev = prevIdx >= 0;
  const hasNext = nextIdx < allLessons.length;

  area.innerHTML = `
    <div class="lesson-content">
      <div class="lesson-hero">
        <div class="lesson-phase-tag" style="background:${ph.color}18;border-color:${ph.color}40;color:${ph.color}">
          <span style="width:6px;height:6px;border-radius:50%;background:${ph.color};display:inline-block;box-shadow:0 0 6px ${ph.color}"></span>
          ${ph.name} &nbsp;·&nbsp; ${lesson.tag}
        </div>
        <h1 class="lesson-title">${lesson.title}</h1>
        <p class="lesson-desc">${lesson.desc}</p>
      </div>

      <button class="done-btn ${done.has(gIdx)?'marked':''}" id="done-btn" onclick="markDone(${gIdx})">
        ${done.has(gIdx) ? '✅ সম্পন্ন হয়েছে' : '☐ সম্পন্ন হিসেবে চিহ্নিত করো'}
      </button>

      ${lesson.content}

      <div class="lesson-nav">
        <button class="nav-btn" onclick="goPrev()" ${!hasPrev?'disabled':''}>← আগের লেসন</button>
        <button class="nav-btn primary" onclick="goNext()" ${!hasNext?'disabled':''}>পরের লেসন →</button>
      </div>
    </div>`;

  window.scrollTo({top: 0, behavior: 'smooth'});
  closeSidebar();
}

function goPrev() {
  if (currentGlobal > 0) {
    const prev = allLessons[currentGlobal - 1];
    loadLesson(prev.phaseIdx, prev.lessonIdx);
  }
}

function goNext() {
  if (currentGlobal < allLessons.length - 1) {
    const next = allLessons[currentGlobal + 1];
    loadLesson(next.phaseIdx, next.lessonIdx);
  }
}

// ============================================================
// DONE TRACKING
// ============================================================
function markDone(gIdx) {
  if (done.has(gIdx)) {
    done.delete(gIdx);
  } else {
    done.add(gIdx);
  }
  localStorage.setItem('php_done', JSON.stringify([...done]));
  buildNav();
  updateProgress();

  const btn = document.getElementById('done-btn');
  if (btn) {
    btn.className = 'done-btn ' + (done.has(gIdx) ? 'marked' : '');
    btn.textContent = done.has(gIdx) ? '✅ সম্পন্ন হয়েছে' : '☐ সম্পন্ন হিসেবে চিহ্নিত করো';
  }
}

function updateProgress() {
  const pct = Math.round((done.size / allLessons.length) * 100);
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ============================================================
// QUIZ
// ============================================================
function checkQuiz(btn, correct) {
  const opts = btn.parentElement.querySelectorAll('.quiz-opt');
  opts.forEach(o => { o.disabled = true; });
  if (correct) {
    btn.classList.add('correct');
    const fb = document.createElement('div');
    fb.className = 'quiz-feedback info-green';
    fb.style.cssText = 'background:rgba(16,217,138,.07);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px;color:#6ee7b7';
    fb.textContent = '🎉 সঠিক উত্তর! চমৎকার!';
    btn.parentElement.parentElement.appendChild(fb);
  } else {
    btn.classList.add('wrong');
    opts.forEach(o => { if (o.dataset.correct === 'true') o.classList.add('correct'); });
    const fb = document.createElement('div');
    fb.style.cssText = 'background:rgba(255,92,92,.07);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px;color:#fca5a5';
    fb.textContent = '❌ ভুল হয়েছে — সঠিক উত্তর সবুজ রঙে দেখানো হচ্ছে।';
    btn.parentElement.parentElement.appendChild(fb);
  }
}

// ============================================================
// SIDEBAR MOBILE
// ============================================================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('overlay').classList.toggle('active');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('overlay').classList.remove('active');
}

// ============================================================
// INIT
// ============================================================
buildNav();
updateProgress();
// Open phase 1 by default
document.getElementById('lessonlist-0')?.classList.add('open');
</script>
</body>
